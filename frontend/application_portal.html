<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Portal | Apply</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
        }
        .navbar {
            margin-bottom: 40px;
        }
        .upload-card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand fw-bold">ATS | Application Portal</span>
            <div class="d-flex">
                <a href="candidate_dashboard.html" class="btn btn-outline-light btn-sm me-2 fw-bold">Back to Jobs</a>
                <button class="btn btn-light btn-sm fw-bold text-primary" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="upload-card text-center">
                    <h2 class="fw-bold text-primary mb-2">Submit Your Application</h2>
                    
                    <h5 class="text-muted mb-4" id="display-job-title">Applying for: Loading...</h5>
                    
                    <hr class="mb-4">
                    
                    <form id="upload-form">
                        <div class="mb-4 text-start">
                            <label for="resume-upload" class="form-label fw-bold">Upload Resume (PDF only)</label>
                            <input class="form-control form-control-lg" type="file" id="resume-upload" accept=".pdf" required>
                            <div class="form-text mt-2">Maximum file size: 5MB. Ensure your resume highlights your key skills!</div>
                        </div>
                        
                        <button type="submit" class="btn btn-success btn-lg w-100 fw-bold" id="submit-btn">
                            Submit Application
                        </button>
                    </form>

                    <div id="upload-alert" class="alert mt-4" style="display: none;" role="alert"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Basic Security Check
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');
        const jobId = localStorage.getItem('apply_job_id');
        const jobTitle = localStorage.getItem('apply_job_title');

        if (!token || role !== 'candidate') {
            alert('Unauthorized access. Please log in as a candidate.');
            window.location.href = 'index.html';
        }

        // 2. Ensure they actually clicked a job to get here
        if (!jobId || !jobTitle) {
            alert('No job selected. Redirecting to the job board.');
            window.location.href = 'candidate_dashboard.html';
        } else {
            // Display the job title on the page
            document.getElementById('display-job-title').innerText = `Applying for: ${jobTitle}`;
        }

        // 3. Logout Logic
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('role');
            window.location.href = 'index.html';
        }

        // 4. Helper function to display alerts
        function showAlert(message, type) {
            const alertBox = document.getElementById('upload-alert');
            alertBox.className = `alert alert-${type} mt-4`;
            alertBox.innerText = message;
            alertBox.style.display = 'block';
        }

        // 5. Handle the Form Submission
        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent page refresh
            
            const fileInput = document.getElementById('resume-upload');
            const file = fileInput.files[0];
            const submitBtn = document.getElementById('submit-btn');
            
            if (!file) {
                showAlert('Please select a PDF resume to upload.', 'danger');
                return;
            }
            
            // UI Polish: Disable the button and show a loading state while the AI processes
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Processing Application & AI Score...';
            document.getElementById('upload-alert').style.display = 'none';
            
            // Package the file using FormData
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                // Send the POST request to the backend
                const response = await fetch(`http://localhost:8000/applications/${jobId}/upload`, {
                    method: 'POST',
                    headers: {
                        // We must send the token so FastAPI knows who is uploading this
                        'Authorization': `Bearer ${token}`
                        // Note: We do NOT set 'Content-Type' here. The browser automatically sets it to 'multipart/form-data' with the correct boundaries.
                    },
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Success! Display the AI Match Score returned by the backend
                    showAlert(`Success! Application submitted. Your AI Match Score for this role is: ${data.ai_match_score}%`, 'success');
                    
                    // Automatically redirect back to the job board after 4 seconds
                    setTimeout(() => {
                        window.location.href = 'candidate_dashboard.html';
                    }, 4000);
                } else {
                    showAlert(`Error: ${data.detail}`, 'danger');
                }
            } catch (error) {
                console.error('Upload failed:', error);
                showAlert('Failed to connect to the server. Please try again.', 'danger');
            } finally {
                // Reset the button state
                submitBtn.disabled = false;
                submitBtn.innerText = 'Submit Application';
            }
        });
    </script>
</body>
</html>
