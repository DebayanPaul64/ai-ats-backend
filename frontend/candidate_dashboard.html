<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Portal | Job Board</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
        }
        .navbar {
            margin-bottom: 40px;
        }
        .job-card {
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s ease;
            margin-bottom: 20px;
        }
        .job-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand fw-bold">ATS | Candidate Portal</span>
            <div class="d-flex">
                <button class="btn btn-light btn-sm fw-bold text-primary" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col">
                <h2 class="fw-bold">Active Job Postings</h2>
                <p class="text-muted">Browse available positions and apply directly below.</p>
            </div>
        </div>

        <div class="row" id="job-board-container">
            <div class="col-12 text-center text-muted mt-5">
                <div class="spinner-border text-primary mb-3" role="status"></div>
                <p>Loading available jobs...</p>
            </div>
        </div>
    </div>

    <script>
        // 1. Basic Security Check: Ensure the user is actually logged in and is a candidate
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');

        if (!token || role !== 'candidate') {
            alert('Unauthorized access. Please log in as a candidate.');
            window.location.href = 'index.html';
        }

        // 2. Logout Logic
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('role');
            window.location.href = 'index.html';
        }

        // 3. Fetch and Display Jobs
        async function loadJobs() {
            const container = document.getElementById('job-board-container');
            
            try {
                // Fetch the jobs from your FastAPI backend
                const response = await fetch('http://localhost:8000/jobs');
                const data = await response.json();
                
                // Clear the loading spinner
                container.innerHTML = ''; 
                
                if (response.ok && data.jobs.length > 0) {
                    // Loop through each job and create an HTML card
                    data.jobs.forEach(job => {
                        // Format the date to be more readable
                        const postDate = new Date(job.created_at).toLocaleDateString();
                        
                        const jobCard = `
                            <div class="col-md-6 mb-4">
                                <div class="card job-card h-100 p-3">
                                    <div class="card-body">
                                        <h4 class="card-title text-primary fw-bold">${job.title}</h4>
                                        <h6 class="card-subtitle mb-3 text-muted">Posted by: ${job.recruiter_name} | ${postDate}</h6>
                                        <p class="card-text">${job.description}</p>
                                    </div>
                                    <div class="card-footer bg-transparent border-0 text-end">
                                        <button class="btn btn-success fw-bold" onclick="applyForJob(${job.job_id}, '${job.title}')">
                                            Apply Now
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                        // Inject the new card into the container
                        container.innerHTML += jobCard;
                    });
                } else {
                    container.innerHTML = '<div class="col-12 text-center text-muted"><p>No active job postings found.</p></div>';
                }
            } catch (error) {
                console.error('Error fetching jobs:', error);
                container.innerHTML = '<div class="col-12 text-center text-danger"><p>Failed to load jobs. Ensure the server is running.</p></div>';
            }
        }

        // 4. Handle the Apply Button click
        function applyForJob(jobId, jobTitle) {
            // Save the selected job details to localStorage so the next page knows what we are applying for
            localStorage.setItem('apply_job_id', jobId);
            localStorage.setItem('apply_job_title', jobTitle);
            
            // Redirect to the Application Portal
            window.location.href = 'application_portal.html';
        }

        // 5. Run the loadJobs function immediately when the page loads
        window.onload = loadJobs;
    </script>
</body>
</html>
