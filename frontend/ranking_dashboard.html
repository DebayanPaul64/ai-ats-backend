<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Portal | Applicant Rankings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .navbar { margin-bottom: 40px; }
        .ranking-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        /* Custom styling for the AI score badge */
        .score-badge {
            font-size: 1.1em;
            padding: 8px 12px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand fw-bold">ATS | Applicant Rankings</span>
            <div class="d-flex">
                <a href="recruiter_dashboard.html" class="btn btn-outline-light btn-sm me-2 fw-bold">Back to Jobs</a>
                <button class="btn btn-light btn-sm fw-bold text-dark" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="ranking-card">
                    <h3 class="fw-bold text-dark mb-4">AI-Ranked Candidates</h3>
                    
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Rank</th>
                                    <th>Candidate Name</th>
                                    <th>Email</th>
                                    <th>Applied On</th>
                                    <th class="text-center">AI Match Score</th>
                                    <th class="text-end">Resume</th>
                                </tr>
                            </thead>
                            <tbody id="applicants-table-body">
                                <tr><td colspan="6" class="text-center text-muted">Loading applicants...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Security Check
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');
        const jobId = localStorage.getItem('view_job_id');

        if (!token || role !== 'recruiter') {
            alert('Unauthorized access. Please log in as a recruiter.');
            window.location.href = 'index.html';
        }

        if (!jobId) {
            alert('No job selected. Returning to dashboard.');
            window.location.href = 'recruiter_dashboard.html';
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('role');
            window.location.href = 'index.html';
        }

        // 2. Fetch and Display Applicants
        async function loadApplicants() {
            const tbody = document.getElementById('applicants-table-body');
            
            try {
                const response = await fetch(`http://localhost:8000/jobs/${jobId}/applications`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                tbody.innerHTML = ''; 
                
                if (response.ok && data.applications.length > 0) {
                    // Loop through the applicants. Since the backend ordered them by score DESC, index 0 is rank 1!
                    data.applications.forEach((app, index) => {
                        const date = new Date(app.applied_at).toLocaleDateString();
                        const rank = index + 1;
                        
                        // Determine badge color based on score
                        let badgeClass = "bg-danger"; // Red for low match
                        if (app.ai_match_score >= 20) badgeClass = "bg-warning text-dark"; // Yellow for medium
                        if (app.ai_match_score >= 50) badgeClass = "bg-success"; // Green for high
                        
                        tbody.innerHTML += `
                            <tr>
                                <td class="fw-bold text-muted">#${rank}</td>
                                <td class="fw-bold">${app.candidate_name}</td>
                                <td><a href="mailto:${app.candidate_email}">${app.candidate_email}</a></td>
                                <td>${date}</td>
                                <td class="text-center">
                                    <span class="badge ${badgeClass} score-badge">${app.ai_match_score}%</span>
                                </td>
                                <td class="text-end">
                                    <a href="http://localhost:8000${app.resume_url}" target="_blank" class="btn btn-sm btn-primary">View PDF</a>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No applications received for this job yet.</td></tr>';
                }
            } catch (error) {
                console.error('Error fetching applicants:', error);
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger">Failed to load applicants.</td></tr>';
            }
        }

        // Load applicants immediately
        window.onload = loadApplicants;
    </script>
</body>
</html>
