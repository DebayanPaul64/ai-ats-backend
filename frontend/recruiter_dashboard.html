<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Portal | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .navbar { margin-bottom: 30px; }
        .dashboard-card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand fw-bold">ATS | Recruiter Portal</span>
            <button class="btn btn-outline-light btn-sm fw-bold" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <div class="dashboard-card">
                    <h4 class="fw-bold text-dark mb-3">Post a New Job</h4>
                    <form id="create-job-form">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Job Title</label>
                            <input type="text" class="form-control" id="job-title" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Job Description & Skills</label>
                            <textarea class="form-control" id="job-desc" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Post Job</button>
                    </form>
                </div>
            </div>

            <div class="col-md-8">
                <div class="dashboard-card">
                    <h4 class="fw-bold text-dark mb-3">Manage Active Postings</h4>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Job Title</th>
                                    <th>Posted By</th>
                                    <th>Date</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="jobs-table-body">
                                <tr><td colspan="4" class="text-center text-muted">Loading jobs...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Security Check
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');

        if (!token || role !== 'recruiter') {
            alert('Unauthorized access. Please log in as a recruiter.');
            window.location.href = 'index.html';
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('role');
            window.location.href = 'index.html';
        }

        // Create a variable to hold our jobs so we don't have to pass text through HTML
        let currentJobs = [];

        // 2. Fetch and Display All Jobs
        async function loadJobs() {
            const tbody = document.getElementById('jobs-table-body');
            try {
                const response = await fetch('http://localhost:8000/jobs');
                const data = await response.json();
                
                tbody.innerHTML = '';
                
                if (response.ok && data.jobs.length > 0) {
                    currentJobs = data.jobs; // Save the jobs to our variable
                    
                    data.jobs.forEach(job => {
                        const date = new Date(job.created_at).toLocaleDateString();
                        tbody.innerHTML += `
                            <tr>
                                <td class="fw-bold">${job.title}</td>
                                <td>${job.recruiter_name}</td>
                                <td>${date}</td>
                                <td class="text-end">
                                    <button class="btn btn-sm btn-success me-1" onclick="viewApplicants(${job.job_id})">View Applicants</button>
                                    <button class="btn btn-sm btn-outline-secondary me-1" onclick="updateJob(${job.job_id})">Edit</button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteJob(${job.job_id})">Delete</button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No jobs posted yet.</td></tr>';
                }
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger">Failed to load jobs.</td></tr>';
            }
        }

        // 3. Create a New Job
        document.getElementById('create-job-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('job-title').value;
            const description = document.getElementById('job-desc').value;

            try {
                const response = await fetch('http://localhost:8000/jobs', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ title, description })
                });

                if (response.ok) {
                    document.getElementById('create-job-form').reset();
                    loadJobs(); // Reload the table
                    alert('Job posted successfully!');
                } else {
                    const data = await response.json();
                    alert(`Error: ${data.detail}`);
                }
            } catch (error) {
                alert('Server error while posting job.');
            }
        });

        // 4. Update a Job
        async function updateJob(jobId) {
            // Find the specific job in our saved array using the ID
            const jobToUpdate = currentJobs.find(job => job.job_id === jobId);
            
            if (!jobToUpdate) {
                alert("Could not find job details.");
                return;
            }

            // Now we safely pull the title and description from the array
            const newTitle = prompt("Update Job Title:", jobToUpdate.title);
            if (newTitle === null) return; // User clicked Cancel
            
            const newDesc = prompt("Update Job Description:", jobToUpdate.description);
            if (newDesc === null) return; // User clicked Cancel

            try {
                const response = await fetch(`http://localhost:8000/jobs/${jobId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ title: newTitle, description: newDesc })
                });

                if (response.ok) {
                    loadJobs();
                } else {
                    const data = await response.json();
                    alert(`Error: ${data.detail}`);
                }
            } catch (error) {
                alert('Server error while updating job.');
            }
        }

        // 5. Delete a Job
        async function deleteJob(jobId) {
            if (!confirm("Are you sure you want to delete this job posting? This will also delete all associated applications!")) return;
            
            try {
                const response = await fetch(`http://localhost:8000/jobs/${jobId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    loadJobs();
                } else {
                    const data = await response.json();
                    alert(`Error: ${data.detail}`);
                }
            } catch (error) {
                alert('Server error while deleting job.');
            }
        }

        // Placeholder for Session 18
        function viewApplicants(jobId) {
            localStorage.setItem('view_job_id', jobId);
            window.location.href = 'ranking_dashboard.html';
        }

        // Load jobs immediately on page load
        window.onload = loadJobs;
    </script>
</body>
</html>
